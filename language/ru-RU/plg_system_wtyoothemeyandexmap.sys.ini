PLG_WTYOOTHEMEYANDEXMAP_WHATS_NEW="<h3>v1.2.0 Что нового?</h3><h4>Исправления</h4><p>1. Исправлена позиция всплывающих окон маркеров</p><p>2. Исправлено отображение иконок маркеров</p><p>3. Дополнен перевод настроек элемента на русский язык</p><h4>Нововведения</h4><p>1. Теперь на мобильных устройствах перетаскивание карты работает <strong>только с помощью двух пальцев</strong></p><p><strong>2. Новые элементы управления картой</strong></p><ul><li>2.1 Элемент <strong>Открыть карту в полноэкранном режиме</strong></li><li>2.2 Элемент <strong>Линейка и планиметр</strong></li><li>2.3 Элемент <strong>Определить моё местоположение</strong></li><li>2.4 Элемент <strong>Управление поворотом и наклоном карты</strong></li><li>2.5 Элемент <strong>Поиск по карте</strong></li></ul><p><strong>3. Новые режимы центрирования карты</strong></p><ul><li>3.1 Режим <strong>Координаты</strong>. Используются значения полей <strong>Широта</strong> и <strong>Долгота</strong></li><li>3.2 Режим <strong>На крайнем маркере</strong>. Используются координаты крайнего установленного на карте маркера</li><li>3.3 Режим <strong>Вмещать все маркеры</strong>. Карта позиционируется и масштабируется для отображения всех установленных маркеров на карте</li></ul><p><strong>4. Настраиваемое расположение элементов управления картой</strong></p><p>5. Добавлена возможность <strong>выбрать цвет маркера</strong></p><p><strong>6. Теперь карта перемещается к маркеру при открытии всплывающего окна</strong></p><p><strong>7. Добавлена возможность скрыть всплывающее окно</strong></p><p>8. Настраиваемый отступ у границ карты</p><p>9. Настраиваемая позиция всплывающего окна относительно маркера. Допустимые значения - <strong>сверху, слева и справа</strong> от маркера</p><p>10. Улучшено указание координат с помощью мини-карты в настройках маркера. Теперь в окне настроек элемента карты при перетаскивании маркера карта следует за ним</p><p><strong>11. Параметры смещения по осям X и Y для иконок маркеров и кластеров</strong></p>"
