PLG_WTYOOTHEMEYANDEXMAP_WHATS_NEW="<h3>v1.2.0 What's new?</h3><h4>Fixes</h4><p>1. Fixed position of marker popups</p><p>2. Fixed display of marker icons</p><p>3. Fixed Russian localization</p><h4>Features</h4><p>1. Dragging the map <strong>only works with two fingers</strong> on mobile devices</p><p>2. Custom map container padding</p><p>3. Added map centering modes:</p><ul><li>3.1 <strong>Coords</strong> mode. The <strong>Latitude</strong> and <strong>Longitude</strong> field values are used</li><li>3.2 <strong>On last marker</strong> mode. Coords from the last added marker are used</li><li>3.3 <strong>Fit all markers</strong> mode. The map is centered and scaled to fit all added markers</li></ul><p>4. Added map controls:</p><ul><li>4.1 <strong>Fullscreen</strong> control</li><li>4.2 <strong>Ruler and planimeter</strong> control</li><li>4.3 <strong>Geolocation</strong> control</li><li>4.4 <strong>Map rotate and tilt</strong> control</li><li>4.5 <strong>Search</strong> control</li></ul><p>5. Now You can choose where to place the map controls, as well as their order</p><p>6. Now You can choose <strong>marker color</strong></p><p>7. Added popup position parameter. Allowed values are <strong>at the top, left and right</strong> of the marker</p><p>8. Now, in the map item settings, when you drag the marker, the map will follow it</p><p>9. The map moves to the marker when the popup is opened</p><p>10. Added X and Y offset parameters for markers and clusters</p>"
